<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RSVP — Pilar &amp; Joe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #120B2E;
    --cyan: #00E5FF;
    --gold: #FFD400;
    --red: #E5341F;
    --muted: #7a6fb0;
    --off-white: #F2F2F2;
    --border: rgba(122, 111, 176, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--off-white);
    font-family: 'JetBrains Mono', monospace;
  }

  .page {
    padding: 28px clamp(20px, 4vw, 64px) 80px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding-bottom: 32px;
  }

  .topbar .exit { color: var(--off-white); text-decoration: none; }
  .topbar .exit:hover { color: var(--gold); }
  .topbar .credits { color: var(--gold); font-weight: bold; }

  h1.heading {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(26px, 4.4vw, 46px);
    line-height: 1.35;
    color: var(--gold);
    text-shadow: 6px 6px 0 var(--red);
    font-weight: normal;
    margin: 0;
  }

  .lead {
    font-size: 13px;
    color: var(--off-white);
    margin: 18px 0 30px;
    line-height: 1.6;
  }

  .players { margin-bottom: 0; }

  .player-box {
    border: 2px solid var(--border);
    padding: 22px;
    margin-bottom: 18px;
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .player-label {
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--off-white);
  }

  .remove-player {
    background: none;
    border: none;
    color: var(--red);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 0;
  }
  .remove-player:hover { color: var(--gold); }

  .name-input {
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    border: 2px solid var(--border);
    color: var(--off-white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
  }
  .name-input:focus { border-color: var(--cyan); }
  .name-input::placeholder { color: #a79cd6; }

  .child-check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  .child-check input {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border: 2px solid var(--muted);
    background: transparent;
    flex: none;
    cursor: pointer;
    margin: 0;
  }
  .child-check input:checked { background: var(--cyan); border-color: var(--cyan); }

  .add-plus-one {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 4px 0 36px;
    background: none;
    border: 2px dashed var(--cyan);
    color: var(--cyan);
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-align: center;
  }
  .add-plus-one:hover { border-color: var(--gold); color: var(--gold); }

  .divider {
    border: none;
    height: 1px;
    background: rgba(122, 111, 176, 0.3);
    margin: 36px 0;
  }

  .levels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 24px 0 40px;
  }

  @media (max-width: 720px) {
    .levels { grid-template-columns: 1fr; }
  }

  .level-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    padding: 20px;
    background: transparent;
    border: 2px solid var(--border);
    color: inherit;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: background 120ms steps(2), border-color 120ms steps(2), color 120ms steps(2);
  }

  .level-card .kicker {
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .level-card .title2 {
    font-size: 18px;
    font-weight: bold;
    color: var(--off-white);
  }
  .level-card .caption {
    font-size: 11px;
    color: var(--muted);
  }

  .level-card.selected[data-level="wedding"] { background: var(--gold); border-color: var(--gold); }
  .level-card.selected[data-level="afterparty"] { background: var(--red); border-color: var(--red); }
  .level-card.selected[data-level="both"] { background: var(--cyan); border-color: var(--cyan); }
  .level-card.selected .kicker,
  .level-card.selected .title2,
  .level-card.selected .caption { color: var(--bg); }

  .field-heading {
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--off-white);
    margin: 0 0 10px;
  }

  .field-caption {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 16px;
  }

  textarea.dietary {
    width: 100%;
    min-height: 120px;
    padding: 16px;
    background: transparent;
    border: 2px solid var(--border);
    color: var(--off-white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  textarea.dietary:focus { border-color: var(--cyan); }
  textarea.dietary::placeholder { color: #a79cd6; }

  .send-btn {
    display: block;
    width: 100%;
    margin-top: 32px;
    padding: 20px;
    background: var(--gold);
    color: var(--bg);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .send-btn:disabled {
    background: rgba(122, 111, 176, 0.35);
    color: rgba(242, 242, 242, 0.5);
    cursor: not-allowed;
  }

  .send-hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 16px;
  }

  .success {
    text-align: center;
    padding: 60px 20px;
  }
  .success .checkmark {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(20px, 3.6vw, 32px);
    color: var(--gold);
    text-shadow: 6px 6px 0 var(--red);
    margin-bottom: 18px;
  }
  .success p {
    font-size: 13px;
    color: var(--off-white);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <a class="exit" href="../">&lsaquo; EXIT</a>
    <span>LVL 0 &middot; RSVP</span>
    <span class="credits" id="credits">CREDITS 01</span>
  </div>

  <form id="rsvp-form">
    <h1 class="heading">WHO IS<br />COMING?</h1>
    <p class="lead">ONE ROW PER HUMAN. TICK THE BOX IF SAID HUMAN IS SMALL.</p>

    <div class="players" id="players"></div>

    <button type="button" class="add-plus-one" id="add-plus-one">+ ADD PLUS ONE</button>

    <hr class="divider" />

    <h1 class="heading">PICK YOUR<br />LEVELS</h1>

    <div class="levels">
      <button type="button" class="level-card" data-level="wedding">
        <span class="kicker">THE WEDDING</span>
        <span class="title2">MADRID</span>
        <span class="caption">19 SEPT 2027</span>
      </button>
      <button type="button" class="level-card" data-level="afterparty">
        <span class="kicker">AFTER PARTY</span>
        <span class="title2">SYDNEY</span>
        <span class="caption">23 DEC 2027</span>
      </button>
      <button type="button" class="level-card" data-level="both">
        <span class="kicker">BOTH!</span>
        <span class="title2">LEGEND MODE</span>
        <span class="caption">TWO CONTINENTS</span>
      </button>
    </div>

    <hr class="divider" />

    <h2 class="field-heading">ANY SPECIAL DIETARY REQUIREMENTS?</h2>
    <p class="field-caption">ALLERGIES, VEGAN, &ldquo;NO CORIANDER EVER&rdquo;. BE HONEST.</p>
    <textarea class="dietary" id="dietary" placeholder="TYPE HERE_"></textarea>

    <button type="button" class="send-btn" id="send-btn" disabled>SEND &#9656;</button>
    <p class="send-hint" id="send-hint">ENTER AT LEAST ONE NAME TO CONTINUE</p>
  </form>

  <div class="success" id="rsvp-success" hidden>
    <div class="checkmark">GG!</div>
    <p>RSVP RECEIVED &mdash; SEE YOU THERE.</p>
  </div>

</div>

<script>
  // Google Apps Script Web App deployment (see rsvp/google-apps-script.gs).
  const RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzDaqij-lDDiusKhQbK4ZN6emuMoHLIZEgHYcJihCynHkdRdwGyYVFcG8XcH62WkjPP/exec';

  const state = {
    players: [{ name: '', child: false }],
    level: null,
  };

  const playersEl = document.getElementById('players');
  const addBtn = document.getElementById('add-plus-one');
  const levelCards = document.querySelectorAll('.level-card');
  const dietaryEl = document.getElementById('dietary');
  const sendBtn = document.getElementById('send-btn');
  const hintEl = document.getElementById('send-hint');
  const creditsEl = document.getElementById('credits');
  const formEl = document.getElementById('rsvp-form');
  const successEl = document.getElementById('rsvp-success');

  function renderPlayers() {
    playersEl.innerHTML = '';
    state.players.forEach((player, i) => {
      const box = document.createElement('div');
      box.className = 'player-box';

      const header = document.createElement('div');
      header.className = 'player-header';

      const label = document.createElement('span');
      label.className = 'player-label';
      label.textContent = i === 0 ? 'PLAYER 1' : `PLUS ONE ${i}`;
      header.appendChild(label);

      if (i > 0) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-player';
        remove.textContent = '− REMOVE';
        remove.addEventListener('click', () => {
          state.players.splice(i, 1);
          renderPlayers();
          updateCredits();
          updateSendState();
        });
        header.appendChild(remove);
      }
      box.appendChild(header);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'name-input';
      input.placeholder = 'YOUR NAME';
      input.value = player.name;
      input.addEventListener('input', () => {
        player.name = input.value;
        updateSendState();
      });
      box.appendChild(input);

      const checkRow = document.createElement('label');
      checkRow.className = 'child-check';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = player.child;
      checkbox.addEventListener('change', () => { player.child = checkbox.checked; });
      checkRow.appendChild(checkbox);
      checkRow.appendChild(document.createTextNode('SMALL HUMAN?'));
      box.appendChild(checkRow);

      playersEl.appendChild(box);
    });
  }

  addBtn.addEventListener('click', () => {
    state.players.push({ name: '', child: false });
    renderPlayers();
    updateCredits();
  });

  levelCards.forEach((card) => {
    card.addEventListener('click', () => {
      state.level = card.dataset.level;
      levelCards.forEach((c) => c.classList.toggle('selected', c === card));
    });
  });

  function updateCredits() {
    creditsEl.textContent = 'CREDITS ' + String(state.players.length).padStart(2, '0');
  }

  function updateSendState() {
    const hasName = state.players.some((p) => p.name.trim().length > 0);
    sendBtn.disabled = !hasName;
    hintEl.style.visibility = hasName ? 'hidden' : 'visible';
  }

  sendBtn.addEventListener('click', async () => {
    const guests = state.players
      .filter((p) => p.name.trim().length > 0)
      .map((p) => ({ name: p.name.trim(), isChild: p.child }));
    if (guests.length === 0) return;

    const payload = {
      guests,
      levels: state.level || 'not specified',
      dietary: dietaryEl.value.trim(),
    };

    sendBtn.disabled = true;
    sendBtn.textContent = 'SENDING…';
    hintEl.style.visibility = 'hidden';

    if (!RSVP_ENDPOINT) {
      console.warn('RSVP_ENDPOINT is not configured yet — see rsvp/google-apps-script.gs for setup.');
      formEl.hidden = true;
      successEl.hidden = false;
      successEl.querySelector('p').textContent = "This form isn't wired up to send yet — tell Joe.";
      return;
    }

    try {
      await fetch(RSVP_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload),
      });
      formEl.hidden = true;
      successEl.hidden = false;
    } catch (err) {
      sendBtn.disabled = false;
      sendBtn.textContent = 'SEND ▶';
      hintEl.textContent = 'SOMETHING WENT WRONG — CHECK YOUR CONNECTION AND TRY AGAIN.';
      hintEl.style.visibility = 'visible';
    }
  });

  renderPlayers();
  updateCredits();
  updateSendState();
</script>

</body>
</html>
