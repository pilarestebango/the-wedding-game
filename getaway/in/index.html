<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're In! — Pilar &amp; Joe</title>
<!-- Invite-only: reached from the getaway details page's CONFIRM button, never linked elsewhere. -->
<meta name="robots" content="noindex, nofollow" />
<!-- Link preview when the URL is shared (WhatsApp etc.): the pool picture.
     These need absolute URLs, so they point at the GitHub Pages address. -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://pilarestebango.github.io/the-wedding-game/getaway/in/" />
<meta property="og:title" content="YOU&#39;RE IN!" />
<meta property="og:description" content="The Getaway: 13-18 September 2027." />
<meta property="og:image" content="https://pilarestebango.github.io/the-wedding-game/getaway/assets/share.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The pool at the getaway house, with the mountains behind" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #120B2E;
    --cyan: #00E5FF;
    --gold: #FFD400;
    --red: #E5341F;
    --muted: #7a6fb0;
    --off-white: #F2F2F2;
    --pink: #E96BC8;
    --gutter: clamp(20px, 4vw, 64px);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--off-white);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
  }

  a { color: var(--cyan); text-decoration: none; }
  a:hover { color: var(--gold); }
  a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* Fireworks behind everything; taps anywhere launch more. */
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 28px var(--gutter) 40px;
    pointer-events: none; /* let taps through to the sky... */
  }

  .page a, .page button { pointer-events: auto; } /* ...except on links and buttons */

  /* ---- topbar: same structure as the details page ---- */

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.05em;
    gap: 12px;
  }

  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar .exit { color: var(--off-white); }
  .topbar .exit:hover { color: var(--gold); }
  .topbar .date { color: var(--gold); font-weight: bold; }

  @media (max-width: 520px) {
    .topbar .date { display: none; }
  }

  .lang-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; }

  .lang-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    font-size: inherit;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 0;
  }

  .lang-toggle button:hover { color: var(--gold); }
  .lang-toggle button:not(.active) { opacity: 0.5; }
  .lang-toggle .sep { color: var(--muted); opacity: 0.5; }

  /* ---- the celebration ---- */

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    padding-top: 32px;
  }

  .title {
    margin: 0;
    font-size: clamp(22px, 7.5vw, 96px);
    line-height: 1.25;
    color: var(--gold);
    text-shadow: 6px 6px 0 var(--red);
    font-weight: normal;
    /* Static on purpose: the couple didn't want the title moving. */
  }

  /* The couple dancing: four frames side by side in one sheet
     (getaway/assets/dance.webp, cut from dance.jpeg). */
  .dance {
    width: min(560px, 92vw);
    aspect-ratio: 492 / 320;
    margin: clamp(20px, 4vh, 40px) 0;
    background: url('../assets/dance.webp') 0 0 / 400% 100% no-repeat;
    image-rendering: pixelated;
    animation: dance 1.6s steps(1, end) infinite, pop 500ms 300ms both;
  }

  @keyframes dance {
    0%   { background-position: 0% 0; }
    25%  { background-position: 33.333% 0; }
    50%  { background-position: 66.667% 0; }
    75%  { background-position: 100% 0; }
  }

  @keyframes pop {
    0%   { transform: translateY(40px) scale(.6); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }

  .msg {
    margin: 0;
    max-width: 34em;
    font-size: clamp(11px, 1.3vw, 18px);
    line-height: 2.2;
    text-wrap: balance;
  }

  .msg strong { color: var(--cyan); font-weight: normal; }

  .xd {
    display: inline-block;
    color: var(--pink);
    animation: blink 600ms steps(2) infinite;
  }

  @keyframes blink { 50% { color: var(--gold); } }

  .back {
    margin-top: clamp(24px, 4vh, 40px);
    font-size: 10px;
    line-height: 1.6;
  }

  .hint {
    margin: 18px 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .dance, .xd { animation: none; }
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="page">

  <div class="topbar">
    <div class="topbar-left">
      <a class="exit" href="../details/" data-i18n="exit">&lsaquo; BACK</a>
      <div class="lang-toggle">
        <button type="button" class="active" data-lang="en">EN</button>
        <span class="sep">/</span>
        <button type="button" data-lang="es">ES</button>
      </div>
    </div>
    <span data-i18n="topbarTitle">SECRET LEVEL &middot; THE GETAWAY</span>
    <span class="date">13&ndash;18.09.27</span>
  </div>

  <main>
    <h1 class="title" data-i18n="heading">YOU&rsquo;RE IN!</h1>

    <div class="dance" role="img" aria-label="Pili and Joe doing a hula dance" data-i18n-label="danceAlt"></div>

    <p class="msg" data-i18n="msg">SO HAPPY TO HAVE YOU IN!<br />PLEASE SEND US A NICE <strong>WHATSAPP</strong> TO TELL US <span class="xd">XD</span></p>

    <p class="hint" data-i18n="hint">tap anywhere for more fireworks...<br />we are too lazy to make another form, sorry!</p>

    <a class="back" href="../details/" data-i18n="back">&lsaquo; BACK TO THE DETAILS</a>
  </main>

</div>

<script>
  const LANG_KEY = 'wedding-lang';

  const STRINGS = {
    en: {
      title: 'You’re In! — Pilar &amp; Joe',
      exit: '&lsaquo; BACK',
      topbarTitle: 'SECRET LEVEL &middot; THE GETAWAY',
      heading: 'YOU&rsquo;RE IN!',
      danceAlt: 'Pili and Joe doing a hula dance',
      msg: 'SO HAPPY TO HAVE YOU IN!<br />PLEASE SEND US A NICE <strong>WHATSAPP</strong> TO TELL US <span class="xd">XD</span>',
      hint: 'tap anywhere for more fireworks...<br />we are too lazy to make another form, sorry!',
      back: '&lsaquo; BACK TO THE DETAILS',
    },
    es: {
      // Press Start 2P has no accented capitals or inverted marks, so no ¡ or accents.
      title: '¡Te apuntas! — Pilar y Joe',
      exit: '&lsaquo; VOLVER',
      topbarTitle: 'NIVEL SECRETO &middot; LA ESCAPADA',
      heading: 'TE APUNTAS!',
      danceAlt: 'Pili y Joe bailando hula',
      msg: 'QUE ILUSION TENERTE CON NOSOTROS!<br />MANDANOS UN <strong>WHATSAPP</strong> BONITO PARA CONTARNOSLO <span class="xd">XD</span>',
      hint: 'toca donde quieras para mas fuegos artificiales...<br />nos ha dado pereza hacer otro formulario, perdon!',
      back: '&lsaquo; VOLVER A LOS DETALLES',
    },
  };

  function applyLanguage(lang) {
    const dict = STRINGS[lang] ?? STRINGS.en;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.dataset.i18n;
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('[data-i18n-label]').forEach((el) => {
      el.setAttribute('aria-label', dict[el.dataset.i18nLabel]);
    });
    document.title = dict.title.replace(/&amp;/g, '&');
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-toggle button').forEach((b) => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      // localStorage unavailable (private mode etc.) — language just won't persist
    }
  }

  let storedLang = 'en';
  try {
    const v = localStorage.getItem(LANG_KEY);
    if (v === 'en' || v === 'es') storedLang = v;
  } catch (e) {
    // ignore
  }
  const urlLang = new URLSearchParams(location.search).get('lang');
  if (urlLang === 'en' || urlLang === 'es') storedLang = urlLang;
  applyLanguage(storedLang);

  document.querySelectorAll('.lang-toggle button').forEach((btn) => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
  });

  // ---- fireworks ----
  // Drawn at a quarter of the screen's resolution and scaled up pixelated, so
  // every spark is a chunky square like the rest of the site.
  (function fireworks() {
    const PIXEL = 4;
    const COLORS = ['#FFD400', '#00E5FF', '#E5341F', '#E96BC8', '#F2F2F2'];
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0;
    const rockets = [];
    const sparks = [];

    function resize() {
      w = Math.ceil(window.innerWidth / PIXEL);
      h = Math.ceil(window.innerHeight / PIXEL);
      canvas.width = w;
      canvas.height = h;
    }
    resize();
    window.addEventListener('resize', resize);

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function launch(x, targetY) {
      rockets.push({
        x: x ?? rand(w * 0.1, w * 0.9),
        y: h,
        vy: -rand(2.2, 3),
        targetY: targetY ?? rand(h * 0.12, h * 0.45),
        color: pick(COLORS),
      });
    }

    function burst(x, y, color) {
      const n = Math.floor(rand(28, 48));
      const second = Math.random() < 0.4 ? pick(COLORS) : color;
      const speed = rand(1.2, 2);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const s = speed * rand(0.6, 1);
        sparks.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: rand(45, 75),
          color: i % 2 ? color : second,
        });
      }
    }

    // A static scatter of bursts, for people who'd rather not see motion.
    if (reduced) {
      for (let i = 0; i < 6; i++) {
        const cx = rand(w * 0.1, w * 0.9), cy = rand(h * 0.1, h * 0.5), c = pick(COLORS);
        for (let j = 0; j < 24; j++) {
          const a = (j / 24) * Math.PI * 2, r = rand(6, 14);
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
        }
      }
      return;
    }

    function frame() {
      // Fade the last frame instead of clearing it, for short trails.
      ctx.fillStyle = 'rgba(18, 11, 46, 0.28)';
      ctx.fillRect(0, 0, w, h);

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy;
        r.vy *= 0.99;
        ctx.fillStyle = r.color;
        ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 2);
        if (r.y <= r.targetY) {
          burst(r.x, r.y, r.color);
          rockets.splice(i, 1);
        }
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.97;
        s.vy = s.vy * 0.97 + 0.03; // gravity
        s.life--;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        // Twinkle as they die out.
        if (s.life < 20 && Math.random() < 0.4) continue;
        ctx.fillStyle = s.color;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
      }

      if (Math.random() < 0.025) launch();
      requestAnimationFrame(frame);
    }

    // The big opening volley, then the odd one now and then.
    for (let i = 0; i < 7; i++) setTimeout(() => launch(), i * 220);
    setTimeout(() => { for (let i = 0; i < 4; i++) launch(); }, 1800);

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('a, button')) return;
      const x = e.clientX / PIXEL, y = e.clientY / PIXEL;
      launch(x, y);
    });

    requestAnimationFrame(frame);
  })();
</script>

</body>
</html>
