<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>THE GETAWAY</title>
<!-- Invite-only: this page is deliberately not linked from the site and kept out of search results. -->
<meta name="robots" content="noindex, nofollow" />
<!-- Link preview when the URL is shared (WhatsApp etc.): the couple in the
     black hole (the details pages use the pool picture instead).
     These need absolute URLs, so they point at the GitHub Pages address. -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://pilarestebango.github.io/the-wedding-game/getaway/" />
<meta property="og:title" content="THE GETAWAY" />
<meta property="og:description" content="You&#39;ve been chosen. Accept the challenge." />
<meta property="og:image" content="https://pilarestebango.github.io/the-wedding-game/getaway/assets/gameshare.png" />
<meta property="og:image:width" content="902" />
<meta property="og:image:height" content="896" />
<meta property="og:image:alt" content="Pixel-art Joe and Pili standing in a black hole among the stars" />
<meta name="twitter:card" content="summary" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #120B2E;
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
  }
  /* The game plays natively in portrait or landscape — no rotation needed.
     #app stacks the Phaser canvas above the touch-control bar (when shown)
     so controls get their own reserved strip instead of floating on top of
     gameplay. 100dvh (where supported) keeps this accurate as mobile browser
     chrome shows/hides. */
  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #game-root {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-root"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
